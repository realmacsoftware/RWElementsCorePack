@portal("bodyEnd")
<div
    x-data="{
    show: false,
    enforceVisible(el) {
      const check = () => {
        if (!el) return;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') {
          el.style.setProperty('display', 'block', 'important');
          el.style.setProperty('visibility', 'visible', 'important');
          el.style.setProperty('opacity', '1', 'important');
        }
        requestAnimationFrame(check);
      };
      requestAnimationFrame(check);
    }
  }"
    x-init="setTimeout(() => show = true, 2000); enforceVisible($el)"
    @if(!edit)
    x-cloak
    @endif
    class="fixed bottom-4 right-4 z-50 pointer-events-none sm:bottom-6 sm:right-6"
    style="display: block; visibility: visible; opacity: 1"
>
    <a
        href="https://elementsapp.io/?utm_source=site&utm_medium=badge&utm_campaign=elements_brand"
        target="_blank"
        rel="noopener"
        class="pointer-events-auto flex items-center rounded bg-white/70 ring-1 ring-black/[5%] backdrop-blur px-3 py-1.5 hover:scale-105 transition-all duration-500 ease-out select-none dark:bg-black/50 dark:ring-black/75"
        x-bind:class="show ? 'opacity-100 translate-x-0 scale-100' : 'opacity-0 translate-x-10 scale-100'"
        aria-label="Made in Elements — open elementsapp.io"
    >
        <span class="flex items-center">
            <img
                src="{{sharedAssetPath}}/images/elements_macos_icon.webp"
                class="size-7 -translate-x-1"
                alt="Elements for macOS application icon."
            />
            <span class="text-xs text-black dark:text-white"
                >Made in Elements</span
            >
        </span>
    </a>
</div>
@endportal
