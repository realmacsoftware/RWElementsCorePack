@portal(bodyEnd, id: "com.realmacsoftware.image.lightbox.js", includeOnce: true)
<script src="{{assetPath}}/image-lightbox.js"></script>
@endportal

@portal(bodyEnd)
<div x-cloak x-data="imageLightbox('{{id}}')">
    <div x-show="open" class="fixed inset-0 z-50 grid place-items-center">
        <div
            @click="$dispatch('image-lightbox-close', { id: '{{id}}' })"
            class="{{classes.lightbox.overlay}}"
            x-show="open"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
        ></div>
        <button
            @click="$dispatch('image-lightbox-close', { id: '{{id}}' })"
            class="absolute top-0 right-0 p-4 text-white z-20"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-8 h-8"
                viewBox="0 0 24 24"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                stroke="currentColor"
                fill="none"
                color="currentColor"
            >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <div
            class="relative z-10 max-w-[90%] max-h-[90%] overflow-hidden w-full h-full"
        >
            <picture>
                <template x-if="srcDark">
                    <source :srcset="srcDark" media="(prefers-color-scheme: dark)" />
                </template>
                <img
                    class="w-full h-full object-contain object-center"
                    :src="src"
                    :alt="alt"
                    @if(imageProtection)
                    oncontextmenu="return false"
                    ondragstart="return false"
                    onmousedown="return false"
                    @endif
                    loading="lazy"
                    x-show="open"
                    x-transition:enter="transition ease-out duration-300"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    x-transition:leave="transition ease-in duration-200"
                    x-transition:leave-start="opacity-100"
                    x-transition:leave-end="opacity-0"
                />
            </picture>
        </div>
    </div>
</div>
@endportal
