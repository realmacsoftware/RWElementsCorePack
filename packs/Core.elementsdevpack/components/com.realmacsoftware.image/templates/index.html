@if(!hasImage)
<img
    class="{{classes.img}}"
    src="{{sharedAssetPath}}/images/image-square.png"
    alt="{{alt}}"
/>
@else
    <picture>
        @if(!isCMSImage)
            @each(source in darkImage.sources)
                <source
                    media="{{source.media}} and (prefers-color-scheme: dark)"
                    srcset="{{source.srcset}}"
                    @if(source.width)
                    width="{{source.width}}"
                    height="{{source.height}}"
                    @endif
                />
            @endeach

            @if(hasDarkImage)
                <source
                    media="(prefers-color-scheme: dark)"
                    srcset="{{darkImage.resource.image}}"
                />
            @endif

            @each(source in lightImage.sources)
                <source
                    media="{{source.media}}"
                    srcset="{{source.srcset}}"
                    @if(source.width)
                    width="{{source.width}}"
                    height="{{source.height}}"
                    @endif
                />
            @endeach
        @endif

        <!-- Fallback img element -->
        <img
            class="{{classes.img}}"
            src="{{lightImage.resource.image}}"
            alt="{{alt}}"
            width="{{imageWidth}}"
            height="{{imageHeight}}"
            @if(wantsLightbox)
            x-data=""
            data-lightbox-breakpoints='{{lightboxBreakpointsJSON}}'
            data-lightbox-src="{{lightboxSrc}}"
            @if(hasDarkImage)
            data-lightbox-src-dark="{{lightboxSrcDark}}"
            @endif
            @click="
                const bps = JSON.parse($el.dataset.lightboxBreakpoints);
                let enabled = false;
                bps.forEach(bp => { if (window.innerWidth >= bp.minWidth) enabled = bp.enabled; });
                if (enabled) $dispatch('image-lightbox-open', {
                    id: '{{id}}',
                    src: $el.dataset.lightboxSrc,
                    srcDark: $el.dataset.lightboxSrcDark || null,
                });
            "
            @endif
            @if(imageProtection)
            oncontextmenu="return false"
            ondragstart="return false"
            onmousedown="return false"
            @endif
            @if(imageLazyLoading)
            loading="lazy"
            @endif
            @if(wantsFetchPriority)
            fetchpriority="{{imageFetchPriority}}"
            @endif
            decoding="async"
        />
    </picture>
@endif

@includeIf(wantsLightbox, template: "lightbox")
