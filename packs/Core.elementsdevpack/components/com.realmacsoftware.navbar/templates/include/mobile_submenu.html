<ul x-show="open" x-cloak x-collapse class="mt-1 flex flex-col gap-y-1 px-4">
    @each(child in page.pages)
    <li
        x-data="{open:false}"
        aria-expanded="false"
        x-bind:aria-expanded="open.toString()"
        @click="open = !open"
    >
        @if(child.isFolder)
        <button
            aria-expanded="false"
            x-bind:aria-expanded="open.toString()"
            class="{{classes.mobile.item}} flex justify-between items-center w-full"
            @if(child.isActive)
            aria-current="page"
            @endif
            @if(child.hasActiveChild)
            data-active-child
            @endif
        >
            <span>{{child.title}}</span>
            @include("mobile_submenu_indicator")
        </button>
        @else @if(child.hasPages)
        <div class="flex items-stretch justify-between">
            <a
                class="{{classes.mobile.item}} flex flex-1 items-center"
                href="{{child.url}}"
                @click.stop
                @if(child.isActive)
                aria-current="page"
                @endif
                @if(child.hasActiveChild)
                data-active-child
                @endif
                @if(child.openInNewWindow)
                target="_blank"
                @endif
                >{{child.title}}</a
            >
            <button
                @click.stop="open = !open"
                aria-expanded="false"
                x-bind:aria-expanded="open.toString()"
                class="flex cursor-pointer items-center pl-2"
            >
                @include("mobile_submenu_indicator")
            </button>
        </div>
        @else
        <a
            class="{{classes.mobile.item}} block"
            href="{{child.url}}"
            @click.stop
            @if(child.isActive)
            aria-current="page"
            @endif
            @if(child.hasActiveChild)
            data-active-child
            @endif
            @if(child.openInNewWindow)
            target="_blank"
            @endif
            >{{child.title}}</a
        >
        @endif @endif @includeIf(child.hasPages, template: "mobile_submenu_menu")
    </li>
    @endeach
</ul>
