<div class="relative">
    <button
        @mouseover="handleMouseEnter"
        @mouseleave="handleMouseLeave"
        class="flex items-center @if(page.isActive){{classes.desktop.itemActive}} @else {{classes.desktop.item}} @endif"
    >
        {{page.title}} @includeIf(page.hasPages, template:
        "desktop_submenu_indicator")
    </button>

    @includeIf(page.hasPages, template: "desktop_submenu")
</div>
