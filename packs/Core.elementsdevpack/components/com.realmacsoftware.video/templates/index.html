@includeIf(wantsLightbox, template:"lightbox")
<div x-bind="trigger" class="{{classes.overlay}}">
  @dropzone("overlay", title: "Overlay")
</div>

@if(!hasThumbnail)
<img
    src="{{video.image}}"
    alt="{{video.name}}"
    class="{{classes.poster}}"
    x-show="!showVideo"
    x-ref="thumbnail"
    @click="showVideo = true"
>
@else
<picture x-show="!showVideo" x-ref="thumbnail" @click="showVideo = true" class="block relative w-full h-full z-0">
  <source srcset="{{thumbnail.image}}" media="(prefers-color-scheme: light)">
  @if(hasDarkThumbnail)
    <source srcset="{{thumbnailDark.image}}" media="(prefers-color-scheme: dark)">
  @endif
  <img
    src="{{thumbnail.image}}"
    alt="{{thumbnailAlt}}"
    class="{{classes.poster}}"
    x-show="!showVideo"
    x-ref="thumbnail"
    @click="showVideo = true"
  >
</picture>
@endif

@if(!edit)
@if(!isMP4)
  <template x-if="showVideo">
    <iframe 
        :src="iframeUrl"
        width="100%"
        height="auto"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        class="{{classes.video}}"
        >
    </iframe>
  </template>
@else
<template x-if="showVideo">
  <video
      x-show="showVideo"
      x-ref="video"
      x-bind="mp4"
      autoplay
      @if(shouldAutoPlay)
        playsinline
      @endif
      class="{{classes.video}}"
  >
      <source src="{{video.path}}" type="video/mp4">
      Your browser does not support the video tag.
  </video>
</template>
@endif
@endif
