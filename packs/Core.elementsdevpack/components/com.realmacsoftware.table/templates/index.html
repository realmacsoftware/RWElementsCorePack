<table class="{{classes.table}}">
    @if(wantsHeader)
    <thead>
        <tr class="{{classes.theadRow}}">
            @each(column in columns)
            <th class="{{classes.th}} {{column.widthClass}}">
                @if(column.useCsvTitle)
                    {{column.title}}
                @else
                    @text("column", default: "Column")
                @endif
            </th>
            @endeach
        </tr>
    </thead>
    @endif
    <tbody class="{{classes.tbody}}">
        @each(row in rows)
        <tr class="{{classes.tr}}">
            @each(cell in row.cells)
                <td class="{{classes.td}} {{cell.widthClass}}">
                    @if(cell.useCsvText)
                        {{cell.text}}
                    @else
                        @text("cell", default: "Cell")
                    @endif
                </td>
            @endeach
        </tr>
        @endeach
    </tbody>
</table>
