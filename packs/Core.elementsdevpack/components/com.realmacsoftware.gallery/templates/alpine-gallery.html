@portal("bodyEnd", id: "com.realmacsoftware.alpine.gallery", includeOnce: true)
<script>
    document.addEventListener("alpine:init", () => {
        Alpine.data("gallery", (id = null, options = {}) => ({
            id,
            open: false,
            remoteImages: [],

            init() {
                window.addEventListener("gallery-close", (e) => {
                    if (this.id === e.detail) {
                        this.close();
                    }
                });

                window.addEventListener("gallery-toggle", (e) => {
                    if (this.id === e.detail.id) {
                        this.toggle();
                    }

                    if (e.detail.slide) {
                        this.$dispatch("slider-scroll-to", {
                            id: this.id,
                            index: e.detail.slide,
                        });
                    }
                });

                window.addEventListener("keyup", (e) => {
                    if (e.key === "Escape") {
                        this.close();
                    }
                });

                if (options.endpoint) {
                    this.loadRemoteImages(options);
                }
            },

            async loadRemoteImages({ endpoint }) {
                try {
                    const response = await fetch(endpoint);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    const images = (data.images || []).map((item) => ({
                        src: item.src,
                        thumb: item.thumb || item.src,
                        caption: item.caption || "",
                        alt: item.caption || "",
                    }));
                    this.remoteImages = images;
                    this.$dispatch("gallery-remote-images", {
                        id: this.id,
                        images,
                    });
                } catch (error) {
                    console.warn(
                        "Gallery: unable to load remote folder listing",
                        error
                    );
                }
            },

            next() {
                console.log("next");
            },

            toggle() {
                this.open = !this.open;
            },

            close() {
                this.open = false;
            },

            wrapper: {
                ["x-show"]() {
                    return this.open;
                },
            },

            backdrop: {
                ["x-show"]() {
                    return this.open;
                },
                ["@click"]() {
                    this.close();
                },
            },

            lightbox: {
                ["x-show"]() {
                    return this.open;
                },
                ["@click.away"]() {
                    this.close();
                },
            },
        }));
    });
</script>
@endportal
