@portal("bodyEnd", id: "com.realmacsoftware.alpine.gallery-lightbox",
includeOnce: true)
<script>
    document.addEventListener("alpine:init", () => {
        Alpine.data("galleryLightbox", (id = null, options = {}) => ({
            id,
            skip: 1,
            atBeginning: false,
            atEnd: false,
            show: false,
            scrollTarget: null,

            init() {
                this.setupKeyboardControls();
                this.setupEventListeners();
            },

            // Pause lightbox video/audio without resetting currentTime so a
            // paused clip still resumes mid-way when the user returns (#57685).
            // Query from the component root. next()/prev()/hide() run from the
            // arrow buttons' @click, and Alpine's $el is that button, which
            // contains no media (#177). Pass a slide to pause only its media
            // when that slide leaves the scrollport.
            pauseLightboxMedia(scope) {
                const root = scope || this.$root;
                if (!root || typeof root.querySelectorAll !== "function") {
                    return;
                }

                root.querySelectorAll("video, audio").forEach((media) => {
                    media.pause();
                });
            },

            setupKeyboardControls() {
                const keyActions = {
                    Escape: () => this.hide(),
                    ArrowRight: () => this.next(),
                    ArrowLeft: () => this.prev(),
                    ArrowUp: () => this.prev(),
                    ArrowDown: () => this.next(),
                    Space: () => this.next(),
                    Enter: () => this.next(),
                };

                window.addEventListener("keydown", (event) => {
                    const action = keyActions[event.key];
                    if (action) {
                        event.preventDefault();
                        action();
                    }
                });
            },

            setupEventListeners() {
                window.addEventListener(
                    "gallery-lightbox-scroll-to",
                    (event) => {
                        if (this.id === event.detail.id) {
                            this.scrollTarget = event.detail.index;
                        }
                    }
                );

                window.addEventListener("gallery-lightbox-show", (event) => {
                    if (this.id === event.detail.id) {
                        this.show = true;
                        this.scrollTarget = event.detail.slide;
                    }
                });

                this.$watch("show", (value) => {
                    if (value && this.scrollTarget !== null) {
                        this.scrollToTarget();
                    }
                    // Overlay/close set show=false directly; pause any playing media.
                    if (!value) {
                        this.pauseLightboxMedia();
                    }
                });
            },

            scrollToTarget() {
                const slider = this.$refs.slider;
                const totalScrollable = slider.scrollWidth - slider.clientWidth;
                const numberOfIntervals = slider.children.length - 1;
                const scrollInterval = totalScrollable / numberOfIntervals;

                slider.scrollLeft = scrollInterval * this.scrollTarget;
                this.scrollTarget = null;
            },

            hide() {
                this.pauseLightboxMedia();
                this.show = false;
            },

            next() {
                this.pauseLightboxMedia();
                this.to((current, offset) => current + offset * this.skip);
            },

            prev() {
                this.pauseLightboxMedia();
                this.to((current, offset) => current - offset * this.skip);
            },

            to(strategy) {
                const slider = this.$refs.slider;
                const current = slider.scrollLeft;
                const offset =
                    slider.firstElementChild.getBoundingClientRect().width;

                slider.scrollTo({
                    left: strategy(current, offset),
                    behavior: "smooth",
                });
            },

            focusableWhenVisible: {
                "x-intersect:enter"() {
                    this.$el.removeAttribute("tabindex");
                },
                // Inset the root. A full-bleed snap leaves the previous slide's
                // edge on the viewport boundary, which threshold 0 still counts
                // as intersecting, so a plain leave never fires on swipe (#177).
                "x-intersect:leave.margin.-1px.-40px.-1px.-40px"() {
                    this.$el.setAttribute("tabindex", "-1");
                    // Swipe and trackpad scrolling never call next()/prev().
                    this.pauseLightboxMedia(this.$el);
                },
            },

            disableNextAndPreviousButtons: {
                "x-intersect:enter.threshold.05"() {
                    this.updateNavigationState(true);
                },
                "x-intersect:leave.threshold.05"() {
                    this.updateNavigationState(false);
                },
            },

            updateNavigationState(isEntering) {
                const slideEls = this.$el.parentElement.children;
                const isFirstSlide = slideEls[0] === this.$el;
                const isLastSlide = slideEls[slideEls.length - 1] === this.$el;

                if (isFirstSlide) {
                    this.atBeginning = isEntering;
                } else if (isLastSlide) {
                    this.atEnd = isEntering;
                }
            },
        }));
    });
</script>
@endportal
